<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Fichiers</title>
    <style>
        :root {
            --sidebar-width: 280px;
            --primary-color: #3b82f6;
            --bg-color: #f8fafc;
            --sidebar-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- SIDEBAR CSS --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            height: 100%;
        }

        .sidebar-header {
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-section {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .btn {
            border: 2px dashed var(--primary-color);
            color: var(--primary-color);
            background-color: #eff6ff;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .file-item {
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 5px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .file-item:hover {
            background-color: #f1f5f9;
        }

        .file-item.active {
            background-color: #eff6ff;
            color: var(--primary-color);
            font-weight: 600;
        }

        .file-icon {
            font-size: 1.2em;
            color: #64748b;
        }

        /* --- MAIN CONTENT CSS --- */
        .main-content {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-viewer {
            flex: 1;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            overflow: auto;
            white-space: pre-wrap;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            color: #334155;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #94a3b8;
            text-align: center;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 6px;
            color: white;
            display: none;
            animation: slideIn 0.3s ease;
        }
        .success { background-color: #10b981; }
        .error { background-color: #ef4444; }

        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <span>📁 My Documents</span>
        </div>

        <div class="upload-section">
            <div class="upload-btn-wrapper">
                <button class="btn" id="uploadBtnText">Upload Fichier</button>
                <input type="file" name="file" id="fileInput" />
            </div>
        </div>

        <ul class="file-list" id="fileList">
            <!-- Liste générée par JS -->
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content-header">
            <h2 id="currentFileName">Aucun fichier sélectionné</h2>
        </div>

        <div id="fileViewer" class="file-viewer">
            <div class="empty-state">
                <p>Sélectionnez un fichier dans la barre latérale pour voir son contenu.</p>
            </div>
        </div>
    </main>

    <div id="notification" class="notification"></div>

    <script>
        // --- LOGIQUE JAVASCRIPT ---

        const fileInput = document.getElementById('fileInput');
        const uploadBtnText = document.getElementById('uploadBtnText');
        const fileList = document.getElementById('fileList');
        const fileViewer = document.getElementById('fileViewer');
        const currentFileName = document.getElementById('currentFileName');

        // Charger la liste des fichiers au démarrage
        document.addEventListener('DOMContentLoaded', fetchFiles);

        // Gestion de l'upload
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            uploadBtnText.innerText = "Upload en cours...";
            
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (response.ok) {
                    showNotification('Fichier uploadé avec succès !', 'success');
                    fetchFiles(); // Rafraîchir la liste
                } else {
                    showNotification(data.error || 'Erreur upload', 'error');
                }
            } catch (err) {
                console.error(err);
                showNotification('Erreur de connexion', 'error');
            } finally {
                uploadBtnText.innerText = "Upload Fichier";
                fileInput.value = ''; // Reset input
            }
        });

        // Récupérer la liste des fichiers
        async function fetchFiles() {
            try {
                const response = await fetch('/api/files');
                const files = await response.json();
                renderFileList(files);
            } catch (err) {
                console.error("Erreur chargement liste:", err);
            }
        }

        // Afficher la liste dans la Sidebar
        function renderFileList(files) {
            fileList.innerHTML = '';
            files.forEach(file => {
                const li = document.createElement('li');
                li.className = 'file-item';
                li.innerHTML = `<span class="file-icon">📄</span> ${file.name}`;
                li.onclick = () => loadFileContent(file.name, li);
                fileList.appendChild(li);
            });
        }

        // Charger et afficher le contenu d'un fichier
        async function loadFileContent(filename, element) {
            // Gestion de la classe active
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            try {
                const response = await fetch(`/api/files/${filename}`);
                const data = await response.json();

                if (response.ok) {
                    currentFileName.innerText = data.name;
                    // Affichage simple du texte pour l'instant
                    // C'est ici que plus tard vous mettrez ReactFlow ou BPMN.js
                    fileViewer.innerText = data.content; 
                } else {
                    fileViewer.innerHTML = `<div class="empty-state" style="color:red">${data.error}</div>`;
                }
            } catch (err) {
                fileViewer.innerHTML = `<div class="empty-state">Erreur lors du chargement du fichier.</div>`;
            }
        }

        // Utilitaire de notification
        function showNotification(message, type) {
            const notif = document.getElementById('notification');
            notif.innerText = message;
            notif.className = `notification ${type}`;
            notif.style.display = 'block';
            setTimeout(() => {
                notif.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
